<svg width="1000" height="996" xmlns="http://www.w3.org/2000/svg">
  <rect width="1000" height="996" fill="#0d1117" rx="10"/>
  <rect width="1000" height="36" fill="#21262d" rx="10"/>
  <rect y="26" width="1000" height="10" fill="#21262d"/>
  <circle cx="20" cy="18" r="5.5" fill="#ff5f57"/>
  <circle cx="38" cy="18" r="5.5" fill="#febc2e"/>
  <circle cx="56" cy="18" r="5.5" fill="#28c840"/>
  <text x="500" y="23" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#484f58" text-anchor="middle">phantomAP_remote — MODULE INDEX</text>
  <line x1="0" y1="36" x2="1000" y2="36" stroke="#30363d" stroke-width="1"/>
  <text x="20" y="52" font-family="'Courier New', Courier, monospace" font-size="13"><tspan fill="#3fb950">   ____  _           _   _                  _    ____</tspan></text>
  <text x="20" y="72" font-family="'Courier New', Courier, monospace" font-size="13"><tspan fill="#3fb950">  |  _ \| |__   __ _| \ | |_ ___  _ __ ___ / \  |  _ \</tspan></text>
  <text x="20" y="92" font-family="'Courier New', Courier, monospace" font-size="13"><tspan fill="#3fb950">  | |_) | '_ \ / _` |  \| | __/ _ \| '_ ` _ \ / _ \ | |_) |</tspan></text>
  <text x="20" y="112" font-family="'Courier New', Courier, monospace" font-size="13"><tspan fill="#3fb950">  |  __/| | | | (_| | |\  | || (_) | | | | | / ___ \|  __/</tspan></text>
  <text x="20" y="132" font-family="'Courier New', Courier, monospace" font-size="13"><tspan fill="#3fb950">  |_|   |_| |_|\__,_|_| \_|\__\___/|_| |_| /_/   \_\_|</tspan></text>
  <text x="20" y="152" font-family="'Courier New', Courier, monospace" font-size="13"><tspan fill="#58a6ff">        Built Miracle Gideon</tspan></text>
  <text x="20" y="192" font-family="'Courier New', Courier, monospace" font-size="13"><tspan fill="#79c0ff">PHANTOMAP</tspan><tspan fill="#c9d1d9"> &gt;&gt; HELP</tspan></text>
  <text x="20" y="232" font-family="'Courier New', Courier, monospace" font-size="13"><tspan fill="#79c0ff">MODULE INDEX</tspan></text>
  <text x="20" y="272" font-family="'Courier New', Courier, monospace" font-size="13"><tspan fill="#c9d1d9">  MODULE                  ARGUMENT     FUNCTION</tspan></text>
  <text x="20" y="292" font-family="'Courier New', Courier, monospace" font-size="13"><tspan fill="#484f58">--------------------------------------------------------------------------------</tspan></text>
  <text x="20" y="312" font-family="'Courier New', Courier, monospace" font-size="13"><tspan fill="#c9d1d9">  PROBE_NEARBY          </tspan><tspan fill="#e3b341">  -          </tspan><tspan fill="#484f58">  802.11 beacon frame enumeration via netsh</tspan></text>
  <text x="20" y="332" font-family="'Courier New', Courier, monospace" font-size="13"><tspan fill="#c9d1d9">  WIFI_PASS_ALL         </tspan><tspan fill="#e3b341">  -          </tspan><tspan fill="#484f58">  Cleartext key material from all saved WLAN profiles</tspan></text>
  <text x="20" y="352" font-family="'Courier New', Courier, monospace" font-size="13"><tspan fill="#c9d1d9">  WIFI_PASS_TARGET      </tspan><tspan fill="#e3b341">  :&lt;SSID&gt;    </tspan><tspan fill="#484f58">  Cleartext key material from a single named WLAN profile</tspan></text>
  <text x="20" y="372" font-family="'Courier New', Courier, monospace" font-size="13"><tspan fill="#c9d1d9">  PROF_LIST             </tspan><tspan fill="#e3b341">  -          </tspan><tspan fill="#484f58">  Enumerate saved WLAN profile identifiers</tspan></text>
  <text x="20" y="392" font-family="'Courier New', Courier, monospace" font-size="13"><tspan fill="#c9d1d9">  ARP_SWEEP             </tspan><tspan fill="#e3b341">  -          </tspan><tspan fill="#484f58">  Layer-2 host discovery via ARP cache</tspan></text>
  <text x="20" y="412" font-family="'Courier New', Courier, monospace" font-size="13"><tspan fill="#c9d1d9">  PORT_AUDIT            </tspan><tspan fill="#e3b341">  -          </tspan><tspan fill="#484f58">  TCP/UDP LISTENING socket state analysis</tspan></text>
  <text x="20" y="432" font-family="'Courier New', Courier, monospace" font-size="13"><tspan fill="#c9d1d9">  DNS_TRACE             </tspan><tspan fill="#e3b341">  -          </tspan><tspan fill="#484f58">  Resolver path enumeration and DNS leak detection</tspan></text>
  <text x="20" y="452" font-family="'Courier New', Courier, monospace" font-size="13"><tspan fill="#c9d1d9">  CONN_MONITOR          </tspan><tspan fill="#e3b341">  -          </tspan><tspan fill="#484f58">  Established session inspection via netstat</tspan></text>
  <text x="20" y="472" font-family="'Courier New', Courier, monospace" font-size="13"><tspan fill="#c9d1d9">  DUMP_REPORT           </tspan><tspan fill="#e3b341">  -          </tspan><tspan fill="#484f58">  Full recon package — all primary modules transmitted</tspan></text>
  <text x="20" y="492" font-family="'Courier New', Courier, monospace" font-size="13"><tspan fill="#c9d1d9">  SYS_ENUM              </tspan><tspan fill="#e3b341">  -          </tspan><tspan fill="#484f58">  Hostname, OS build, architecture, uptime, user context</tspan></text>
  <text x="20" y="512" font-family="'Courier New', Courier, monospace" font-size="13"><tspan fill="#c9d1d9">  PROC_ENUM             </tspan><tspan fill="#e3b341">  -          </tspan><tspan fill="#484f58">  Full process enumeration with PID and memory state</tspan></text>
  <text x="20" y="532" font-family="'Courier New', Courier, monospace" font-size="13"><tspan fill="#c9d1d9">  ROUTE_TABLE           </tspan><tspan fill="#e3b341">  -          </tspan><tspan fill="#484f58">  IPv4/IPv6 routing table via route print</tspan></text>
  <text x="20" y="552" font-family="'Courier New', Courier, monospace" font-size="13"><tspan fill="#c9d1d9">  FIREWALL_AUDIT        </tspan><tspan fill="#e3b341">  -          </tspan><tspan fill="#484f58">  Windows Firewall profile states and active rule summary</tspan></text>
  <text x="20" y="572" font-family="'Courier New', Courier, monospace" font-size="13"><tspan fill="#c9d1d9">  SHARES_ENUM           </tspan><tspan fill="#e3b341">  -          </tspan><tspan fill="#484f58">  Local and remote SMB network share enumeration</tspan></text>
  <text x="20" y="592" font-family="'Courier New', Courier, monospace" font-size="13"><tspan fill="#c9d1d9">  USER_ENUM             </tspan><tspan fill="#e3b341">  -          </tspan><tspan fill="#484f58">  Local user accounts and administrator group membership</tspan></text>
  <text x="20" y="612" font-family="'Courier New', Courier, monospace" font-size="13"><tspan fill="#c9d1d9">  STARTUP_ENUM          </tspan><tspan fill="#e3b341">  -          </tspan><tspan fill="#484f58">  Autorun entries from registry and startup locations</tspan><tspan fill="#f85149">  *</tspan></text>
  <text x="20" y="632" font-family="'Courier New', Courier, monospace" font-size="13"><tspan fill="#c9d1d9">  CRED_VAULT            </tspan><tspan fill="#e3b341">  -          </tspan><tspan fill="#484f58">  Windows Credential Manager stored entry enumeration</tspan></text>
  <text x="20" y="652" font-family="'Courier New', Courier, monospace" font-size="13"><tspan fill="#c9d1d9">  RDP_STATUS            </tspan><tspan fill="#e3b341">  -          </tspan><tspan fill="#484f58">  Remote Desktop protocol state and active session query</tspan><tspan fill="#f85149">  *</tspan></text>
  <text x="20" y="672" font-family="'Courier New', Courier, monospace" font-size="13"><tspan fill="#c9d1d9">  PROXY_CFG             </tspan><tspan fill="#e3b341">  -          </tspan><tspan fill="#484f58">  System proxy configuration and WinHTTP settings</tspan></text>
  <text x="20" y="692" font-family="'Courier New', Courier, monospace" font-size="13"><tspan fill="#c9d1d9">  HOSTS_READ            </tspan><tspan fill="#e3b341">  -          </tspan><tspan fill="#484f58">  Read contents of system hosts file</tspan></text>
  <text x="20" y="712" font-family="'Courier New', Courier, monospace" font-size="13"><tspan fill="#c9d1d9">  ADAPTER_DEEP          </tspan><tspan fill="#e3b341">  -          </tspan><tspan fill="#484f58">  Full NIC detail — MAC, speed, driver, link state</tspan></text>
  <text x="20" y="732" font-family="'Courier New', Courier, monospace" font-size="13"><tspan fill="#c9d1d9">  BT_SCAN               </tspan><tspan fill="#e3b341">  -          </tspan><tspan fill="#484f58">  Paired and visible Bluetooth device enumeration</tspan></text>
  <text x="20" y="752" font-family="'Courier New', Courier, monospace" font-size="13"><tspan fill="#c9d1d9">  ENV_DUMP              </tspan><tspan fill="#e3b341">  -          </tspan><tspan fill="#484f58">  System and user environment variable dump</tspan></text>
  <text x="20" y="772" font-family="'Courier New', Courier, monospace" font-size="13"><tspan fill="#c9d1d9">  DISK_INFO             </tspan><tspan fill="#e3b341">  -          </tspan><tspan fill="#484f58">  Drive letters, used/free/total space, filesystem types</tspan></text>
  <text x="20" y="812" font-family="'Courier New', Courier, monospace" font-size="13"><tspan fill="#c9d1d9">  HELP                  </tspan><tspan fill="#e3b341">  -          </tspan><tspan fill="#484f58">  Display this module index</tspan></text>
  <text x="20" y="832" font-family="'Courier New', Courier, monospace" font-size="13"><tspan fill="#c9d1d9">  LOGS                  </tspan><tspan fill="#e3b341">  -          </tspan><tspan fill="#484f58">  List saved output log files</tspan></text>
  <text x="20" y="852" font-family="'Courier New', Courier, monospace" font-size="13"><tspan fill="#c9d1d9">  EXIT                  </tspan><tspan fill="#e3b341">  -          </tspan><tspan fill="#484f58">  Terminate client process</tspan></text>
  <text x="20" y="892" font-family="'Courier New', Courier, monospace" font-size="13"><tspan fill="#f85149">  *</tspan><tspan fill="#484f58"> May require elevated privileges on the Windows receiver</tspan></text>
  <text x="20" y="932" font-family="'Courier New', Courier, monospace" font-size="13"><tspan fill="#79c0ff">PHANTOMAP</tspan><tspan fill="#c9d1d9"> &gt;&gt; </tspan><tspan fill="#c9d1d9">█</tspan></text>
</svg>